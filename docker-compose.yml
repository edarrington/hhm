version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hhm-postgres
    environment:
      POSTGRES_USER: hhm_user
      POSTGRES_PASSWORD: hhm_password
      POSTGRES_DB: hhm_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hhm_user -d hhm_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hhm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hhm-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://hhm_user:hhm_password@postgres:5432/hhm_dev
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: development
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python -m src

volumes:
  postgres_data:
  redis_data:
